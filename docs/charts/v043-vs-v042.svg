<text x="980" y="410" font-size="12" class="d" text-anchor="start" >caught = risky commands asked about or blocked</text>
<text x="980" y="430" font-size="12" class="d" text-anchor="start" >stopped = safe commands asked about or blocked (red: over 10%)</text>
<text x="980" y="450" font-size="12" class="d" text-anchor="start" >blocked = risky commands blocked outright</text>
<text x="980" y="510" font-size="13" class="w" text-anchor="start" letter-spacing="1">A HARDER BENCHMARK</text>
<text x="980" y="538" font-size="12" class="" text-anchor="start" >lancet-bench-2-next replaces lancet-bench-1 (793 Bash commands),</text>
<text x="980" y="560" font-size="12" class="" text-anchor="start" >where the strongest guards were near the ceiling:</text>
<text x="980" y="582" font-size="12" class="" text-anchor="start" >· 3,204 commands as 1,602 risky/safe look-alike twins</text>
<text x="980" y="604" font-size="12" class="" text-anchor="start" >· 289 scenarios in 40 areas; Bash, PowerShell and cmd</text>
<text x="980" y="626" font-size="12" class="" text-anchor="start" >· every scenario repeated inside 6 shell wrappers</text>
<text x="980" y="648" font-size="12" class="" text-anchor="start" >  (subshell, function, $( ), bash -c, pipeline, background)</text>
<text x="980" y="670" font-size="12" class="" text-anchor="start" >· never used for training, tuning or calibration</text>
<text x="980" y="692" font-size="12" class="w" text-anchor="start" >Every guard scores lower on it. v0.4.2 scored 82.7</text>
<text x="980" y="714" font-size="12" class="w" text-anchor="start" >on the old benchmark and 54.4 on this one.</text>
<line x1="40" x2="1560" y1="790" y2="790" stroke="#161a1f"/>
<text x="56" y="818" font-size="12" class="" text-anchor="start" >Triage Score: every risky command asked about or blocked earns a point; the score shrinks in proportion when more than 10% of safe commands are stopped.</text>
<text x="56" y="838" font-size="11" class="d" text-anchor="start" >ShellRisk-Bench (Kontext Security) test split; neutral set: Rogue Security coding-agent-security-benchmark + tomngdev/shell-safety-v2 (Bash cases).</text>
</svg>