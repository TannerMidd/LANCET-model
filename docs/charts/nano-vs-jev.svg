#ffc23d" text-anchor="middle" font-weight="400" letter-spacing="0" >required · per call</text><text x="820.0" y="470.0" font-size="12" fill="#5d8783" text-anchor="start" font-weight="400" letter-spacing="0" >Nano has 12× fewer parameters than Laya and ~212× fewer than Jev.   *Jev: estimate, not disclosed.</text><rect x="24" y="512" width="1552" height="318" fill="#050c0e" stroke="#123034"/><text x="44.0" y="536.0" font-size="12" fill="#5d8783" text-anchor="start" font-weight="400" letter-spacing="3" >ACCURACY ON 400 FRESH COMMANDS  ·  SAME 0–100% SCALE FOR EVERY BAR</text><rect x="1110" y="526" width="12" height="12" fill="#2dff9a"/><text x="1128.0" y="537.0" font-size="12" fill="#d6f4ef" text-anchor="start" font-weight="400" letter-spacing="0" >LANCET Nano</text><rect x="1260" y="526" width="12" height="12" fill="#b48cff"/><text x="1278.0" y="537.0" font-size="12" fill="#d6f4ef" text-anchor="start" font-weight="400" letter-spacing="0" >Laya</text><rect x="1410" y="526" width="12" height="12" fill="#ffc23d"/><text x="1428.0" y="537.0" font-size="12" fill="#d6f4ef" text-anchor="start" font-weight="400" letter-spacing="0" >Jev</text><text x="44.0" y="580.0" font-size="15" fill="#d6f4ef" text-anchor="start" font-weight="700" letter-spacing="0" >Catches risky commands</text><text x="44.0" y="600.0" font-size="12" fill="#5d8783" text-anchor="start" font-weight="400" letter-spacing="0" >higher is better</text><rect x="450" y="556" width="730" height="60" fill="#020506"/><line x1="450.0" y1="556" x2="450.0" y2="616" stroke="#0b1b1d"/><line x1="632.5" y1="556" x2="632.5" y2="616" stroke="#0b1b1d"/><line x1="815.0" y1="556" x2="815.0" y2="616" stroke="#0b1b1d"/><line x1="997.5" y1="556" x2="997.5" y2="616" stroke="#0b1b1d"/><line x1="1180.0" y1="556" x2="1180.0" y2="616" stroke="#0b1b1d"/><rect x="450" y="560" width="612.4" height="14" fill="#2dff9a"/><text x="1070.4" y="572.0" font-size="12" fill="#2dff9a" text-anchor="start" font-weight="700" letter-spacing="0" >83.9%  (17